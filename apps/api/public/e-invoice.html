<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request e-Invoice</title><style>body{font:16px system-ui,sans-serif;background:#f5f7f5;color:#173c2c;margin:0;padding:24px}.card{max-width:520px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px #173c2c20}label{display:block;margin:12px 0;font-weight:600}input,select,textarea,button{box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #bfd0c3;border-radius:9px;font:inherit}button{background:#17613e;color:#fff;border:0;font-weight:700;margin-top:16px}.notice{padding:12px;background:#fff4d8;border-radius:9px}.hidden{display:none}</style></head><body><main class="card"><h1>Request an e-Invoice</h1><p id="receipt">Loading receipt…</p><p class="notice">This receipt is not validated by LHDN. Submit your details to request an individual e-Invoice.</p><form id="form" class="hidden"><label>Entity type<select id="entity"><option value="MALAYSIAN_INDIVIDUAL">Malaysian individual</option><option value="MALAYSIAN_COMPANY">Malaysian company</option><option value="FOREIGN_INDIVIDUAL">Foreign individual</option><option value="FOREIGN_COMPANY">Foreign company</option></select></label><label>Legal name<input id="name" required></label><label>TIN<input id="tin"></label><label>Registration / ID number<input id="registration"></label><label>Phone<input id="phone"></label><label>Email<input id="email" required type="email"></label><label>Billing address<textarea id="address" rows="3"></textarea></label><button>Submit e-Invoice request</button></form><p id="message" role="status"></p></main><script>const t=new URLSearchParams(location.search).get('token'),m=document.querySelector('#message'),f=document.querySelector('#form');async function r(o){const x=await fetch('/api/e-invoice/request/'+t,o);const b=await x.json();if(!x.ok)throw Error(b.message||'Request failed');return b}if(!t)m.textContent='Invalid request link.';else r().then(x=>{document.querySelector('#receipt').textContent=`${x.company} · Receipt ${x.receiptNo} · RM${Number(x.total).toFixed(2)}`;if(x.status==='AVAILABLE')f.classList.remove('hidden');else m.textContent='An e-Invoice request has already been received.'}).catch(e=>m.textContent=e.message);f.addEventListener('submit',async e=>{e.preventDefault();try{const x=await r({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entityType:entity.value,name:name.value,tin:tin.value||undefined,registrationNo:registration.value||undefined,phone:phone.value||undefined,email:email.value,address:address.value||undefined})});f.classList.add('hidden');m.textContent=x.message}catch(e){m.textContent=e.message}})</script></body></html>
