# Local-only profile: both the POS and PostgreSQL are reachable only from the
# Windows host. Do not use this profile when phones or other LAN devices must
# access RetailOS.
services:
  postgres:
    # Replace the base Compose port mapping instead of adding a second mapping.
    # This keeps the local database on 55433 and avoids a collision with an
    # existing PostgreSQL service using Windows port 5432.
    ports: !override
      - "127.0.0.1:55433:5432"
  api:
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:31080:3000"
  seed:
    env_file:
      - .env.local
